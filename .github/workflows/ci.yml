name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run rebuild-native
      - run: npm test
      - run: npm run build
      - name: Package installer
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-${{ matrix.arch }}
          path: release/*.exe

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=verbose
      # Native addon build skipped on macOS (not implemented)
      # - run: npm run build

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=verbose
      # Native addon build skipped on Linux (not implemented)
      # - run: npm run build
